name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  gmssl-cgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build GmSSL backend and run tests (-tags gmssl)
        run: docker build -f deploy/gmssl/Dockerfile --target test -t encryption-gmssl:ci .

      - name: Assert CGO backend was selected
        run: |
          docker run --rm encryption-gmssl:ci bash -c '
            cd /src/encryption
            echo "CgoFiles: $(go list -tags gmssl -f "{{.CgoFiles}}" ./adapter/sm4)"
            test "$(go list -tags gmssl -f "{{.CgoFiles}}" ./adapter/sm4)" = "[backend_gmssl.go]"
          '

  cgo-disabled-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # -tags gmssl 但未开 cgo 时必须显式失败，不允许静默回退到纯 Go。
      - name: -tags gmssl without cgo fails loudly
        run: CGO_ENABLED=0 go test -tags gmssl -count=1 -run NoCGO ./adapter/sm4 ./adapter/sm2
