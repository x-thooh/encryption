name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  gmssl-cgo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build GmSSL backend and run tests (-tags gmssl)
        run: docker build -f deploy/gmssl/Dockerfile --target test -t encryption-gmssl:ci .

      - name: Assert CGO backend was selected
        run: |
          docker run --rm encryption-gmssl:ci bash -c '
            cd /src/encryption
            echo "CgoFiles: $(go list -tags gmssl -f "{{.CgoFiles}}" ./adapter/sm4)"
            test "$(go list -tags gmssl -f "{{.CgoFiles}}" ./adapter/sm4)" = "[backend_gmssl.go]"
          '
